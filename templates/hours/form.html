{% extends "base.html" %}
{% block title %}{{ 'Editar' if entry else 'Cargar' }} horas{% endblock %}
{% block content %}
<h2>{{ 'Editar registro' if entry else 'Cargar horas' }}</h2>
<div class="card">
  <form method="post">
    <div class="row">
      <div class="field">
        <label>Fecha *</label>
        <input type="date" name="entry_date" required
               value="{{ entry.entry_date.strftime('%Y-%m-%d') if entry else today.strftime('%Y-%m-%d') }}">
      </div>
      <div class="field">
        <label>Horas *</label>
        <input type="number" step="0.25" min="0.25" name="hours" required
               value="{{ entry.hours if entry else '' }}">
      </div>
      <div class="field">
        <label>Persona *</label>
        <input type="text" name="person" required
               value="{{ entry.person if entry else '' }}">
      </div>
    </div>
    <div class="field">
      <label>Proyecto *</label>
      <select name="project_id" required>
        <option value="">— Elegí un proyecto —</option>
        {% for p in projects %}
          <option value="{{ p.id }}" {% if entry and entry.project_id == p.id %}selected{% endif %}>
            {{ p.client.name }} · {{ p.name }}{% if not p.active %} (inactivo){% endif %}
          </option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Descripción / tarea</label>
      <textarea name="description">{{ entry.description if entry and entry.description else '' }}</textarea>
    </div>
    <button class="btn" type="submit">Guardar</button>
    <a class="btn secondary" href="{{ url_for('hours_list') }}">Cancelar</a>
  </form>
</div>
{% endblock %}
